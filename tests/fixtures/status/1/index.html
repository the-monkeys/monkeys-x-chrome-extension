<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Reply composer regression</title>
<h1>Reply composer regression</h1>
<pre id="status">Running…</pre>
<a data-testid="AppTabBar_Profile_Link" href="/monkeys_com_co">Bot profile</a>
<input id="decoy" type="file" accept="image/*" hidden>
<div data-testid="tweetTextarea_0" contenteditable="true" style="display:none">Unrelated hidden composer</div>
<section id="composer">
  <div data-testid="tweetTextarea_0" contenteditable="true" aria-label="Reply text" style="border:1px solid;padding:12px"></div>
  <input id="upload" type="file" accept="image/*">
  <div data-testid="attachments"></div>
  <button data-testid="tweetButtonInline">Reply</button>
</section>
<script>
  const caption = 'Here is your Monkeys snapshot.';
  const composer = document.getElementById('composer');
  const editor = composer.querySelector('[contenteditable]');
  let composeClaimed = false, postClaimed = false, clicks = 0, wrongUploads = 0;
  const listeners = [];
  const traces = [];
  document.getElementById('decoy').onchange = () => wrongUploads++;
  document.getElementById('upload').onchange = event => {
    const image = new Image(); image.alt = 'Attached screenshot'; image.width = 32;
    image.src = URL.createObjectURL(event.target.files[0]);
    composer.querySelector('[data-testid="attachments"]').append(image);
  };
  composer.querySelector('button').onclick = () => {
    clicks++;
    const toast = document.createElement('div'); toast.dataset.testid = 'toast';
    toast.textContent = 'Your post was sent.'; document.body.append(toast);
  };
  window.chrome = { runtime: {
    onMessage: { addListener: listener => listeners.push(listener) },
    sendMessage: async message => {
      if (message.type === 'AUTOMATION_TRACE') { traces.push(message); return { accepted: true }; }
      if (message.type === 'GET_REPLY_WORK') return { work: {
        jobId: 'job-1', token: 'attempt-1', tweetId: '1', account: 'monkeys_com_co', caption,
        dataUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRZkAAAAASUVORK5CYII=',
        deadline: Date.now() + 60000,
      } };
      if (message.type === 'CLAIM_REPLY_COMPOSE') {
        if (composeClaimed) return { accepted: false };
        composeClaimed = true; return { accepted: true };
      }
      if (message.type === 'CLAIM_REPLY') { postClaimed = true; return { accepted: true }; }
      if (message.type === 'REPLY_CONFIRMED') {
        const imageCount = composer.querySelectorAll('[data-testid="attachments"] img').length;
        const steps = traces.map(trace => trace.event);
        const pass = editor.innerText === caption && imageCount === 1 && clicks === 1 && postClaimed && wrongUploads === 0 &&
          steps.includes('image_assigned') && steps.includes('attachment_preview_result') && steps.indexOf('attachment_preview_result') < steps.indexOf('caption_insert_started');
        document.getElementById('status').textContent = JSON.stringify({ result: pass ? 'PASS' : 'FAIL',
          caption: editor.innerText, imageCount, clicks, wrongUploads, buildId: message.buildId, steps }, null, 2);
        return { accepted: true };
      }
      document.getElementById('status').textContent = 'FAIL: ' + JSON.stringify(message);
      return { accepted: false };
    },
  } };
  setTimeout(() => { for (const listener of listeners) { listener({ type: 'CHECK_AND_RUN_REPLY' }); listener({ type: 'CHECK_AND_RUN_REPLY' }); } }, 100);
</script>
<script src="/dist/x-reply-automator.js"></script>
</html>
